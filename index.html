<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HHdH: StadsBosch Grid tool</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section id="controls">
        <!-- Kleuren -->
        <div class="control">
          <label for="fg">Kleur kratjes</label>
          <input id="fg" type="color" value="#2ca06a" />
        </div>

        <!-- Raster en canvas -->
        <!-- <div class="control">
          <label for="blobScale">Blob schaal</label>
          <input id="blobScale" type="range" min="0.5" max="3" step="0.1" value="1.0" />
        </div> -->
        <div class="control">
          <label for="blobRotation">Rotatie</label>
          <input id="blobRotation" type="range" min="-180" max="180" step="1" value="0" />
        </div>

        <div class="control">
          <label for="zoom">Zoom</label>
          <input id="zoom" type="range" min="0.2" max="8" step="0.1" value="1" />
        </div>

        <div class="control">
          <label for="canvasWidth">Canvas breedte</label>
          <input id="canvasWidth" type="number" min="200" max="2000" step="10" value="1200" />
        </div>

        <div class="control">
          <label for="canvasHeight">Canvas hoogte</label>
          <input id="canvasHeight" type="number" min="200" max="1500" step="10" value="750" />
        </div>

        <div class="control">
          <label>
            <input id="showMeterGrid" type="checkbox" checked />Toon 1×1m grid
          </label>
        </div>

        <div class="control">
          <label>
            <input id="showBlobGuides" type="checkbox" checked />Toon guides
          </label>
        </div>

        <div class="control control-row">
          <button id="undoBlob" type="button">Undo</button>
          <button id="clearBlobs" type="button">Reset</button>
        </div>

        <div class="control">
          <div id="totalRectCount" class="total-counter">0 KRATJES</div>
        </div>

        <!-- Export -->
        <div class="control">
          <button id="exportPng" type="button">Export PNG</button>
          <button id="exportSvg" type="button">Export SVG</button>
        </div>

        <p class="interaction-help">
          + en - om te zoomen. <br> Klik en sleep om blobs te verplaatsen of te navigeren.
        </p>

        <footer class="credits">
          <span>Ontwikkeld door Joep Horn</span>
          <span>Eigendom van HeyHeydeHaas</span>
        </footer>
      </section>

      <div id="canvasWrap"></div>
    </main>

    <script src="./libs/p5.min.js"></script>
    <script src="./libs/p5.svg.js"></script>

    <script src="./src/params.js"></script>
    <script src="./src/transition-manager.js"></script>
    <script src="./src/export-manager.js"></script>
    <script src="./src/scene-manager.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
